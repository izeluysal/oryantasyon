<!doctype html>
<html lang="{{ aktif_dil }}" data-yerel-ayar="{{ yerel_ayar }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ code }} - {{ t('app.name') }}</title>
  <style>
    :root { --surface-page: #f9f9f7; --surface-card: #fcfcfb; --text-primary: #0b0b0b; --text-secondary: #52514e;
            --border: #e1e0d9; --primary: #2a78d6; }
    @media (prefers-color-scheme: dark) {
      :root { --surface-page: #0d0d0d; --surface-card: #1a1a19; --text-primary: #ffffff; --text-secondary: #c3c2b7;
              --border: #2c2c2a; --primary: #3987e5; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--surface-page);
           color: var(--text-primary); font-family: -apple-system, "Segoe UI", Arial, sans-serif; }
    .box { background: var(--surface-card); border: 1px solid var(--border); border-radius: 12px;
           padding: 32px; max-width: 440px; margin: 16px; text-align: center; }
    .code { font-size: 3rem; font-weight: 700; color: var(--primary); }
    p { color: var(--text-secondary); }
    a { color: var(--primary); text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">{{ code }}</div>
    <h1>{{ t('error.' ~ code ~ '.title') }}</h1>
    <p>{{ t('error.' ~ code ~ '.message') }}</p>
    <a href="/">{{ t('error.back_home') }}</a>
  </div>
</body>
</html>
